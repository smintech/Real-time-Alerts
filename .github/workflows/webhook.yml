name: Scheduled Webhook

on:
  schedule:
    # School updates: Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
    # Fuel prices: Every Saturday at 07:00 UTC
    - cron: "30 6 * * 6"
    # Cleanup: Every Sunday at 03:00 UTC (weekly)
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job to trigger manually'
        required: true
        default: 'school-updates'
        type: choice
        options:
          - school-updates
          - fuel-prices
          - cleanup
          - watches
          - channel-deals
          - trial-check

jobs:
  # Determine which job to run based on schedule or manual input
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Determine job type
        id: job
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.job_type }}" >> $GITHUB_OUTPUT
          else
            # Map cron schedule to job type
            MINUTE=$(date -u +'%-M')
            HOUR=$(date -u +'%-H')
            DOW=$(date -u +'%-w')  # 0=Sunday, 6=Saturday
            
            # School updates: Every 6 hours (0, 6, 12, 18)
            if [ "$MINUTE" == "0" ] && ([ "$HOUR" == "0" ] || [ "$HOUR" == "6" ] || [ "$HOUR" == "12" ] || [ "$HOUR" == "18" ]); then
              # But not Saturday 7am (fuel) or Sunday 3am (cleanup)
              if ! ([ "$DOW" == "6" ] && [ "$HOUR" == "7" ]) && ! ([ "$DOW" == "0" ] && [ "$HOUR" == "3" ]); then
                echo "type=school-updates" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            
            # Fuel prices: Saturday 7:00
            if [ "$DOW" == "6" ] && [ "$HOUR" == "6" ] && [ "$MINUTE" == "30" ]; then
              echo "type=fuel-prices" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Cleanup: Sunday 3:00
            if [ "$DOW" == "0" ] && [ "$HOUR" == "3" ] && [ "$MINUTE" == "0" ]; then
              echo "type=cleanup" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            echo "type=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Call School Updates Webhook
        if: steps.job.outputs.type == 'school-updates'
        run: |
          curl -X POST https://real-time-alerts-1.onrender.com/v1/jobs/school-updates \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{
              "type": "school-updates",
              "scheduled_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "next_run": "'$(date -u -d "+6 hours" +"%Y-%m-%dT%H:%M:%SZ")'"
            }' \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30

      - name: Call Fuel Prices Webhook
        if: steps.job.outputs.type == 'fuel-prices'
        run: |
          curl -X POST https://real-time-alerts-1.onrender.com/v1/jobs/fuel-prices \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{
              "type": "fuel-prices",
              "scheduled_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "note": "Weekly Saturday run"
            }' \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30

      - name: Call Cleanup Webhook
        if: steps.job.outputs.type == 'cleanup'
        run: |
          curl -X POST https://real-time-alerts-1.onrender.com/v1/jobs/cleanup \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{
              "type": "cleanup",
              "scheduled_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "note": "Weekly Sunday cleanup"
            }' \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30

      # PLACEHOLDER JOBS - Uncomment and modify as needed
      # These are defined but not triggered by schedule (only manual)

      - name: '[PLACEHOLDER] Watches Check'
        if: github.event.inputs.job_type == 'watches'
        run: |
          echo "Placeholder: Watches check job"
          curl -X POST https://real-time-alerts-1.onrender.com/v1/jobs/check-watches \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{"type": "watches", "mode": "manual"}' \
            --retry 3 \
            --max-time 30 || echo "Watches endpoint not fully implemented"

      - name: '[PLACEHOLDER] Channel Deals'
        if: github.event.inputs.job_type == 'channel-deals'
        run: |
          echo "Placeholder: Channel deals job"
          curl -X POST https://real-time-alerts-1.onrender.com/v1/jobs/channel-deals \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{"type": "channel-deals", "mode": "manual"}' \
            --retry 3 \
            --max-time 30 || echo "Channel deals endpoint not fully implemented"

      - name: '[PLACEHOLDER] Trial Check'
        if: github.event.inputs.job_type == 'trial-check'
        run: |
          echo "Placeholder: Trial check job"
          curl -X POST https://real-time-alerts-1.onrender.com/v1/jobs/trial-check \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{"type": "trial-check", "mode": "manual"}' \
            --retry 3 \
            --max-time 30 || echo "Trial check endpoint not fully implemented"

      - name: Log Unknown Schedule
        if: steps.job.outputs.type == 'unknown'
        run: |
          echo "No matching job for current schedule slot"
          echo "This is normal - some cron slots are intentionally empty"
