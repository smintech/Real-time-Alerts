name: Scheduled Webhook

on:
  schedule:
    # School updates: Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
    # Fuel prices: Saturday 06:30 UTC (changed to avoid conflict)
    #- cron: "30 6 * * 3"  # Wednesday
    #- cron: "30 6 * * 6"  # Saturday
    # Cleanup: Every Sunday at 03:00 UTC (weekly)
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job to trigger manually'
        required: true
        default: 'school-updates'
        type: choice
        options:
          - school-updates
          - fuel-prices
          - cleanup
          - watches
          - channel-deals
          - trial-check

env:
  BASE_URL: https://real-time-alerts-1.onrender.com
  WAKEUP_DELAY: 50

jobs:
  school-updates:
    if: github.event.schedule == '0 */6 * * *' || github.event.inputs.job_type == 'school-updates'
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (Health Check)
        run: |
          echo "Pinging health endpoint to wake up Render..."
          curl -s -o /dev/null -w "%{http_code}" "${{ env.BASE_URL }}/health" || true
          echo "Waiting ${{ env.WAKEUP_DELAY }}s for cold start..."
          sleep ${{ env.WAKEUP_DELAY }}
          
      - name: Call School Updates Webhook
        run: |
          echo "Calling school-updates endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${{ env.BASE_URL }}/v1/jobs/school-updates" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{
              "type": "school-updates",
              "scheduled_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
            }' \
            --max-time 60)
          echo "Response: $RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Received HTTP $HTTP_CODE"
            exit 1
          fi

  fuel-prices:
    if: github.event.schedule == '30 6 * * 3' || github.event.schedule == '30 6 * * 6' || github.event.inputs.job_type == 'fuel-prices'
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (Health Check)
        run: |
          echo "Pinging health endpoint to wake up Render..."
          curl -s -o /dev/null -w "%{http_code}" "${{ env.BASE_URL }}/health" || true
          echo "Waiting ${{ env.WAKEUP_DELAY }}s for cold start..."
          sleep ${{ env.WAKEUP_DELAY }}
          
      - name: Call Fuel Prices Webhook
        run: |
          echo "Calling fuel-prices endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${{ env.BASE_URL }}/v1/jobs/fuel-prices" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{
              "type": "fuel-prices",
              "scheduled_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
            }' \
            --max-time 60)
          echo "Response: $RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Received HTTP $HTTP_CODE"
            exit 1
          fi

  cleanup:
    if: github.event.schedule == '0 3 * * 0' || github.event.inputs.job_type == 'cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (Health Check)
        run: |
          echo "Pinging health endpoint to wake up Render..."
          curl -s -o /dev/null -w "%{http_code}" "${{ env.BASE_URL }}/health" || true
          echo "Waiting ${{ env.WAKEUP_DELAY }}s for cold start..."
          sleep ${{ env.WAKEUP_DELAY }}
          
      - name: Call Cleanup Webhook
        run: |
          echo "Calling cleanup endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${{ env.BASE_URL }}/v1/jobs/cleanup" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{
              "type": "cleanup",
              "scheduled_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
            }' \
            --max-time 60)
          echo "Response: $RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Received HTTP $HTTP_CODE"
            exit 1
          fi

  # PLACEHOLDER JOBS - Manual trigger only
  watches:
    if: github.event.inputs.job_type == 'watches'
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (Health Check)
        run: |
          curl -s -o /dev/null "${{ env.BASE_URL }}/health" || true
          sleep ${{ env.WAKEUP_DELAY }}
      - name: Call Watches Webhook (Placeholder)
        run: |
          curl -s -X POST "${{ env.BASE_URL }}/v1/jobs/check-watches" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{"type": "watches"}' \
            --max-time 60 || echo "Watches job completed or failed"

  channel-deals:
    if: github.event.inputs.job_type == 'channel-deals'
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (Health Check)
        run: |
          curl -s -o /dev/null "${{ env.BASE_URL }}/health" || true
          sleep ${{ env.WAKEUP_DELAY }}
      - name: Call Channel Deals Webhook (Placeholder)
        run: |
          curl -s -X POST "${{ env.BASE_URL }}/v1/jobs/channel-deals" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{"type": "channel-deals"}' \
            --max-time 60 || echo "Channel deals job completed or failed"

  trial-check:
    if: github.event.inputs.job_type == 'trial-check'
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (Health Check)
        run: |
          curl -s -o /dev/null "${{ env.BASE_URL }}/health" || true
          sleep ${{ env.WAKEUP_DELAY }}
      - name: Call Trial Check Webhook (Placeholder)
        run: |
          curl -s -X POST "${{ env.BASE_URL }}/v1/jobs/trial-check" \
            -H "Authorization: Bearer ${{ secrets.API_SECRET_KEY }}" \
            -d '{"type": "trial-check"}' \
            --max-time 60 || echo "Trial check job completed or failed"
